<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>우리 반 윷놀이 한마당 (태블릿 접속)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Gowun+Dodum&family=Nanum+Brush+Script&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--paper:#f6edd8;--paper2:#efe1c0;--ink:#2f241a;--ink2:#6b5a45;--red:#c3352a;--gold:#e8b33a;--card:#fffaf0;--line:#dcc8a0;
  --dc-g:#2f7d5b;--dc-r:#b5332b;--dc-b:#1f4f8f;--dc-y:#e6b422}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:'Gowun Dodum',system-ui,sans-serif;color:var(--ink);min-height:100vh;overflow-x:hidden;
  background:radial-gradient(ellipse at 10% 0%,rgba(255,255,255,.7),transparent 50%),radial-gradient(ellipse at 90% 100%,rgba(195,53,42,.08),transparent 50%),
  repeating-linear-gradient(0deg,rgba(150,110,60,.035) 0 2px,transparent 2px 5px),var(--paper)}
h1,h2,h3,.dh{font-family:'Do Hyeon',sans-serif;font-weight:400;letter-spacing:.5px}
button{font-family:inherit;cursor:pointer}
.dancheong{height:12px;background:linear-gradient(90deg,transparent 0 8px,#fff 8px 10px,transparent 10px) 0 0/40px 100%,
  repeating-linear-gradient(90deg,var(--dc-g) 0 18px,var(--dc-r) 18px 22px,var(--dc-b) 22px 34px,var(--dc-y) 34px 40px);box-shadow:0 2px 0 #2b1d12}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 18px;background:linear-gradient(#fffaf0,#f3e6c8);border-bottom:3px double var(--ink2)}
header h1{margin:0;display:flex;align-items:center;gap:10px;font-family:'Nanum Brush Script',cursive;font-size:40px;line-height:1}
header h1 .seal{font-family:'Black Han Sans';background:var(--red);color:#fff;border-radius:8px;padding:4px 9px 2px;font-size:22px;transform:rotate(-6deg);box-shadow:2px 2px 0 #7d1d15}
.room{font-family:'Black Han Sans';background:var(--ink);color:#ffd54a;border-radius:10px;padding:4px 12px;font-size:22px;letter-spacing:3px}
.stat{font-size:14px;display:flex;align-items:center;gap:5px}
.stat i{width:10px;height:10px;border-radius:50%;background:#aaa;display:inline-block}
.stat.ok i{background:#2bb24c;box-shadow:0 0 0 3px rgba(43,178,76,.25)}
.stat.bad i{background:#e0402f}
nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
nav button{font-family:'Do Hyeon';font-size:19px;color:var(--ink);padding:6px 14px;border-radius:999px;border:2px solid transparent;background:none}
nav button.on{background:var(--ink);color:var(--paper)}
.snd{display:flex;gap:5px}
.tog{border:2px solid var(--ink2);background:#fff;border-radius:999px;padding:4px 10px;font-size:14px;color:var(--ink)}
.tog.off{opacity:.45;text-decoration:line-through}
main{padding:16px;max-width:1440px;margin:0 auto}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 3px 0 rgba(120,90,50,.15)}
.btn{font-family:'Do Hyeon';font-size:20px;border:none;border-radius:12px;padding:10px 18px;background:var(--ink);color:var(--paper);box-shadow:0 4px 0 #000a;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #000a}
.btn.red{background:linear-gradient(#d4473b,#a8281e)}
.btn.gold{background:linear-gradient(#f2c44e,#d39a14);color:#3b2400}
.btn.light{background:#fff;color:var(--ink);border:2px solid var(--ink2);box-shadow:0 3px 0 var(--line)}
.btn.sm{font-size:16px;padding:6px 12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.big{font-size:28px;padding:14px 20px;width:100%}
label.row{display:flex;align-items:center;gap:10px;margin:9px 0;flex-wrap:wrap}
select,input[type=text]{font-family:inherit;font-size:18px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.seg{display:inline-flex;border:2px solid var(--ink2);border-radius:999px;overflow:hidden}
.seg button{border:none;background:#fff;padding:6px 13px;font-size:16px;color:var(--ink)}
.seg button.on{background:var(--ink);color:var(--paper)}
.muted{color:var(--ink2);font-size:15px;line-height:1.6}
.err{background:#fde8e5;border:2px solid #e9a79f;color:#8d1f14;border-radius:12px;padding:10px 14px;margin:10px 0;font-weight:bold}

/* join */
.join{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;max-width:980px;margin:24px auto}
.join h2{margin:0 0 12px;font-size:30px}
.join .f{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.join .f input,.join .f select{font-size:24px;text-align:center}
#jCode{font-family:'Black Han Sans';letter-spacing:10px;font-size:36px!important}

/* lobby */
.lobby{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}
.bigcode{text-align:center;background:var(--ink);color:#fff;border-radius:18px;padding:16px}
.bigcode .n{font-family:'Black Han Sans';font-size:96px;letter-spacing:16px;color:#ffd54a;line-height:1.1}
.bigcode .u{font-size:17px;word-break:break-all;opacity:.9}
.plist{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pchip{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 8px 6px 12px;font-size:18px}
.pchip .g{font-family:'Do Hyeon';border-radius:999px;padding:2px 9px;font-size:15px;color:#fff;background:#999;border:none}
.pchip .x{border:none;background:none;font-size:16px;color:#a33;padding:0 4px}
.pchip i{width:9px;height:9px;border-radius:50%;background:#bbb}
.pchip i.on{background:#2bb24c}
.teamsprev{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.teamsprev div{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 12px}

/* play */
.play{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start}
.boardwrap{position:relative;padding:16px;border-radius:24px;background:linear-gradient(135deg,#7a4a22,#5a3416);
  box-shadow:inset 0 0 0 3px var(--gold),inset 0 0 0 7px #4a2a10,0 12px 26px rgba(70,40,15,.35)}
.boardwrap::before,.boardwrap::after{content:'';position:absolute;left:16px;right:16px;height:6px;border-radius:3px;
  background:repeating-linear-gradient(90deg,#d6453a 0 14px,#f2c12e 14px 28px,#3a9a5b 28px 42px,#2e66c0 42px 56px,#f08cb0 56px 70px,#fff 70px 76px)}
.boardwrap::before{top:5px}.boardwrap::after{bottom:5px}
.boardin{border-radius:12px;overflow:hidden;background:repeating-linear-gradient(45deg,rgba(160,120,60,.13) 0 3px,transparent 3px 9px),
  repeating-linear-gradient(-45deg,rgba(160,120,60,.13) 0 3px,transparent 3px 9px),radial-gradient(circle at center,#fbf3df,#ecd9ae)}
#board{width:100%;height:auto;display:block;max-height:calc(100vh - 140px);touch-action:manipulation}
#board .pc.can{cursor:pointer}
#board .pc .ring{animation:ring 1s infinite ease-in-out}
@keyframes ring{0%,100%{opacity:.95;transform:scale(1)}50%{opacity:.25;transform:scale(1.25)}}
#board .pc .ring,#board .hopper{transform-box:fill-box;transform-origin:center}
#board .hop .hopper{animation:hop .23s ease-out}
@keyframes hop{0%{transform:translateY(0) scale(1)}45%{transform:translateY(-26px) scale(1.18)}100%{transform:translateY(0) scale(1)}}
#board .prev{fill:none;stroke-width:10;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:3 15;animation:dash .6s linear infinite;opacity:.85}
@keyframes dash{to{stroke-dashoffset:-18}}
#board .dest{fill:none;stroke-width:5;stroke-dasharray:9 6;animation:spin 3s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.shake{animation:shake .5s}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(5px,-3px)}30%,50%,70%{transform:translate(-8px,3px)}40%,60%{transform:translate(8px,-2px)}}
.splash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:5}
.splash .inner{display:flex;flex-direction:column;align-items:center;animation:splash 1.45s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes splash{0%{transform:scale(.2) rotate(-12deg);opacity:0}18%{transform:scale(1.12) rotate(2deg);opacity:1}30%{transform:scale(1)}78%{transform:scale(1);opacity:1}100%{transform:scale(1.25);opacity:0}}
.splash .emo{font-size:min(110px,16vw);line-height:1;filter:drop-shadow(0 6px 6px rgba(0,0,0,.3))}
.splash .word{font-family:'Black Han Sans';font-size:min(150px,20vw);line-height:1.05;color:#fff;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:0 8px 0 rgba(0,0,0,.25)}
.splash .sub{font-family:'Do Hyeon';font-size:min(34px,6vw);background:var(--ink);color:#fff;padding:4px 20px;border-radius:999px;margin-top:6px}
.splash.gold .word{color:#ffd54a;-webkit-text-stroke-color:#7a1d10;font-size:min(190px,24vw)}
.splash.red .word{color:#ff5a4a}
.splash.small .word{font-size:min(96px,14vw)}.splash.small .emo{font-size:min(70px,11vw)}
.splash .rays{position:absolute;width:900px;height:900px;border-radius:50%;background:repeating-conic-gradient(rgba(255,214,74,.55) 0 10deg,transparent 10deg 20deg);
  -webkit-mask:radial-gradient(circle,#000 10%,transparent 62%);mask:radial-gradient(circle,#000 10%,transparent 62%);animation:rays 1.45s linear forwards}
@keyframes rays{0%{transform:scale(.2) rotate(0);opacity:0}15%{opacity:1}80%{opacity:1}100%{transform:scale(1) rotate(80deg);opacity:0}}
.side{display:flex;flex-direction:column;gap:12px}
.turn{border-radius:18px;padding:12px 16px;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.25);display:flex;align-items:center;gap:12px;position:relative;overflow:hidden}
.turn::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.25) 50%,transparent 70%);background-size:250% 100%;animation:shine 2.5s infinite;pointer-events:none}
@keyframes shine{from{background-position:150% 0}to{background-position:-100% 0}}
.turn.mine{outline:5px solid #ffd54a;animation:mine 1s infinite}
@keyframes mine{50%{transform:scale(1.025)}}
.turn .big{font-size:50px;line-height:1;background:rgba(255,255,255,.25);border-radius:50%;width:68px;height:68px;display:flex;align-items:center;justify-content:center;flex:none}
.turn .who{font-family:'Do Hyeon';font-size:29px;line-height:1.1}
.turn .thrower{font-size:16px;margin-top:2px}
.turn .msg{font-size:16px;margin-top:3px;font-weight:bold}
.vs{display:flex;align-items:center;justify-content:center;gap:10px;font-family:'Do Hyeon';font-size:20px}
.tray{position:relative;height:200px;border-radius:16px;background:repeating-linear-gradient(90deg,rgba(120,80,30,.18) 0 2px,transparent 2px 7px),
  repeating-linear-gradient(0deg,rgba(120,80,30,.12) 0 2px,transparent 2px 7px),radial-gradient(ellipse at center,#e9cf95,#c99d58);
  box-shadow:inset 0 0 0 3px #a8793a,inset 0 0 25px rgba(90,50,10,.4);perspective:700px}
.stk{position:absolute;width:30px;height:134px;transform-style:preserve-3d;transform:rotateZ(var(--rz)) rotateY(var(--ry));z-index:2}
.stk.toss{animation:toss .95s cubic-bezier(.25,.8,.35,1) both}
@keyframes toss{0%{transform:translate(var(--sx),230px) rotateZ(0deg) rotateY(calc(var(--ry) - 1440deg)) rotateX(0deg) scale(.55)}
  45%{transform:translate(calc(var(--sx) * .4),-150px) rotateZ(calc(var(--rz) + 300deg)) rotateY(calc(var(--ry) - 600deg)) rotateX(540deg) scale(1.35)}
  78%{transform:translate(0,10px) rotateZ(var(--rz)) rotateY(calc(var(--ry) - 90deg)) rotateX(700deg) scale(1)}
  88%{transform:translate(0,-12px) rotateZ(var(--rz)) rotateY(calc(var(--ry) - 20deg)) rotateX(720deg) scale(1.03)}
  100%{transform:translate(0,0) rotateZ(var(--rz)) rotateY(var(--ry)) rotateX(720deg) scale(1)}}
.face{position:absolute;inset:0;border-radius:15px/42px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;box-shadow:2px 4px 6px rgba(60,30,5,.45)}
.f-flat{background:linear-gradient(90deg,#efd6a2,#fbeccb 45%,#f3dcae 60%,#e5c68c);border:2px solid #a77b40;color:#4a2e10;font-weight:900;font-size:17px}
.f-round{transform:rotateY(180deg);border:2px solid #4e2c0d;background:repeating-linear-gradient(172deg,#8b5a2b 0 5px,#774920 5px 9px,#93622f 9px 12px)}
.f-round::before,.f-round::after{content:'';width:100%;height:5px;background:#3e2208;opacity:.55}
.stk.mark .f-flat{box-shadow:0 0 0 3px var(--red),2px 4px 6px rgba(60,30,5,.45)}
.stk.mark .f-flat .bk{color:var(--red)}
.throwbtn{animation:pulse 1.1s infinite}
@keyframes pulse{50%{box-shadow:0 4px 0 #000a,0 0 0 8px rgba(195,53,42,.25)}}
.manual{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.manual .btn{font-size:22px;padding:8px 4px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-height:46px}
.chip{font-family:'Do Hyeon';font-size:24px;padding:4px 14px;border-radius:999px;border:3px solid var(--ink2);background:#fff;color:var(--ink)}
.chip.on{background:var(--red);border-color:var(--red);color:#fff;transform:scale(1.08);box-shadow:0 3px 0 #7d1d15}
.chip.dis{opacity:.35}
.teams{display:flex;flex-direction:column;gap:8px}
.tm{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:14px;border:2px solid var(--line);background:#fff}
.tm.cur{box-shadow:0 0 0 3px currentColor inset}
.tm .em{font-size:28px}
.tm .nm{font-family:'Do Hyeon';font-size:20px;color:var(--ink);line-height:1.1}
.tm .nm small{display:block;font-family:'Gowun Dodum';font-size:12px;color:var(--ink2)}
.tm .wait{display:flex;gap:3px;flex:1;flex-wrap:wrap;align-items:center;min-height:30px}
.tok{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.3),0 2px 3px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-size:16px}
.tm .done{font-size:15px;white-space:nowrap;color:#b8860b;letter-spacing:-1px}
.startbtn{font-family:'Do Hyeon';font-size:18px;border:none;border-radius:9px;padding:7px 12px;color:#fff;animation:glow .9s infinite;box-shadow:0 3px 0 rgba(0,0,0,.3)}
@keyframes glow{50%{filter:brightness(1.3);transform:scale(1.05)}}
.log{font-size:15px;color:var(--ink2);max-height:120px;overflow:auto;line-height:1.6}
.log b{color:var(--ink)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1;font-size:16px;padding:8px}
.flyer{position:fixed;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:24px;z-index:70;pointer-events:none;
  transition:transform .85s cubic-bezier(.5,-0.4,.6,1),opacity .85s;box-shadow:0 6px 12px rgba(0,0,0,.35)}
.ovr{display:flex;align-items:center;gap:8px;font-size:15px;background:#fff3d6;border:2px dashed var(--gold);border-radius:12px;padding:8px 10px}

/* bracket */
.bk-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bracket{display:flex;gap:30px;overflow-x:auto;padding:6px 4px 16px}
.round{display:flex;flex-direction:column;justify-content:space-around;gap:14px;min-width:230px}
.round h3{margin:0 0 4px;text-align:center;font-size:22px;background:var(--ink);color:var(--paper);border-radius:999px;padding:4px}
.match{background:#fff;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.match.mine{border-color:#2bb24c;box-shadow:0 0 0 4px rgba(43,178,76,.25)}
.match.live{border-color:var(--red)}
.match .t{display:flex;align-items:center;gap:6px;padding:8px 10px;font-size:18px;min-height:42px}
.match .t .sc{margin-left:auto;font-size:13px;color:#b8860b}
.match .t+.t{border-top:1px dashed var(--line)}
.match .t.win{font-weight:bold;background:linear-gradient(90deg,#ffe9b0,#fff6dc)}
.match .t.lose{opacity:.4;text-decoration:line-through}
.match .t.empty{color:#bbb}
.match .t .wbtn{margin-left:6px;border:none;background:var(--ink);color:#fff;border-radius:6px;font-size:12px;padding:2px 6px}
.match .foot{display:flex;gap:6px;padding:6px;background:var(--paper2);flex-wrap:wrap}
.match .foot button{flex:1;font-family:'Do Hyeon';font-size:16px;border:none;border-radius:8px;padding:6px;background:linear-gradient(#d4473b,#a8281e);color:#fff}
.match .foot button.ghost{background:transparent;color:var(--ink2);flex:none}
.match .foot button.watch{background:var(--ink)}
.livebadge{font-size:12px;background:var(--red);color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;animation:glow 1s infinite}
.champ{text-align:center;padding:16px;font-family:'Do Hyeon';font-size:30px;border-radius:16px;margin-bottom:10px;background:radial-gradient(circle,#fff5d1,#f2d68a);border:3px solid var(--gold)}
.champ .name{font-family:'Black Han Sans';font-size:60px;color:var(--red)}
.modal{position:fixed;inset:0;background:rgba(30,20,10,.6);display:flex;align-items:center;justify-content:center;z-index:50}
.modal .box{background:radial-gradient(circle at top,#fff8e2,#f6e3b4);border-radius:26px;padding:28px 46px;text-align:center;max-width:90vw;border:5px solid var(--gold);box-shadow:0 0 0 6px var(--red),0 20px 50px rgba(0,0,0,.5);animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
.modal .box .em{font-size:100px;line-height:1;animation:bob 1s infinite ease-in-out}
@keyframes bob{50%{transform:translateY(-10px) rotate(6deg)}}
.modal .box h2{font-family:'Black Han Sans';font-size:60px;margin:4px 0;color:var(--red)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.pcsbox{padding:24px 30px}
.pcsopts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.pcsbtn{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:120px;padding:16px 10px;border-radius:18px;border:3px solid var(--line);background:#fff;color:var(--ink);transition:transform .1s}
.pcsbtn:hover{transform:translateY(-3px);border-color:var(--ink2)}
.pcsbtn.on{border-color:var(--red);box-shadow:0 0 0 4px rgba(195,53,42,.2)}
.pcsbtn .dots{color:var(--red);font-size:22px;letter-spacing:2px;min-height:28px}
.pcsbtn .l{font-family:'Black Han Sans';font-size:40px;line-height:1}
.pcsbtn .d{font-size:14px;color:var(--ink2)}
@media (max-width:700px){.pcsopts{grid-template-columns:1fr 1fr}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);background:var(--ink);color:#fff;font-family:'Do Hyeon';font-size:24px;padding:8px 22px;border-radius:999px;z-index:80;pointer-events:none;animation:toast 1.8s forwards;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-10px)}15%,75%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@media (max-width:1020px){.play,.join,.lobby{grid-template-columns:1fr}header h1{font-size:30px}main{padding:10px}
  #board{max-height:52vh}.boardwrap{padding:12px}.side{display:grid;grid-template-columns:1fr 1fr;gap:10px}.side>.vs,.side>.turn,.side>#log,.side>#hostTools{grid-column:1/-1}
  .tray{height:150px}.stk{transform:rotateZ(var(--rz)) rotateY(var(--ry)) scale(.8)}.side>.card{grid-column:1/-1}}
@media (max-width:1020px) and (orientation:portrait){.side>.teams{grid-column:1/-1}#board{max-height:44vh}}
</style>
</head>
<body>
<div class="dancheong"></div>
<header>
  <h1><span class="seal">윷</span>우리 반 윷놀이 한마당</h1>
  <span class="room" id="hRoom" hidden></span>
  <span class="stat" id="hStat" hidden><i></i><span></span></span>
  <nav id="hNav"></nav>
  <div class="snd">
    <button class="tog" id="tBgm">🎵</button>
    <button class="tog" id="tSfx">🔊</button>
    <button class="tog" id="tVoice">🗣️</button>
    <button class="tog" id="fsBtn">⛶</button>
  </div>
</header>
<main id="app"></main>

<div class="modal" id="modal" hidden><div class="box">
  <div class="em" id="winEmo">🏆</div><div class="dh" style="font-size:28px">🎉 경기 끝! 🎉</div>
  <h2 id="winName"></h2><div class="dh" style="font-size:30px;margin-bottom:18px">승리!</div>
  <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">

/* =================== 소리 =================== */
const SND={ctx:null,
  init(){
    if(this.ctx){if(this.ctx.state==='suspended')this.ctx.resume().catch(()=>{});return true;}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
    try{this.ctx=new AC();}catch(e){return false;}
    const c=this.ctx,comp=c.createDynamicsCompressor();comp.connect(c.destination);
    this.master=c.createGain();this.master.gain.value=.9;this.master.connect(comp);
    this.bgm=c.createGain();this.bgm.gain.value=bgmOn()?.2:0;this.bgm.connect(this.master);
    this.sfx=c.createGain();this.sfx.gain.value=LP.sfx?1:0;this.sfx.connect(this.master);
    const len=Math.floor(c.sampleRate*2),ir=c.createBuffer(2,len,c.sampleRate);
    for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2);}
    this.rev=c.createConvolver();this.rev.buffer=ir;const rg=c.createGain();rg.gain.value=.32;this.rev.connect(rg);rg.connect(this.master);
    const nb=c.createBuffer(1,c.sampleRate,c.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;this.noiseBuf=nb;
    return true;
  },
  out(w){return w==='bgm'?this.bgm:this.sfx},
  osc(type,f,t,dur,vol,w,o={}){
    const c=this.ctx,os=c.createOscillator(),g=c.createGain();
    os.type=type;os.frequency.setValueAtTime(o.f0||f,t);
    if(o.f0)os.frequency.exponentialRampToValueAtTime(f,t+(o.bend||.04));
    if(o.f2)os.frequency.exponentialRampToValueAtTime(o.f2,t+dur);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+(o.att||.004));g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    let node=os;
    if(o.vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=o.vib;lg.gain.value=f*.012;l.connect(lg);lg.connect(os.frequency);l.start(t+.12);l.stop(t+dur);}
    if(o.filter){const fl=c.createBiquadFilter();fl.type=o.filter;fl.frequency.value=o.ff||1000;os.connect(fl);node=fl;}
    node.connect(g);g.connect(this.out(w));
    if(o.rev){const s=c.createGain();s.gain.value=o.rev;g.connect(s);s.connect(this.rev);}
    os.start(t);os.stop(t+dur+.02);
  },
  noise(t,dur,vol,w,o={}){
    const c=this.ctx,src=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();
    src.buffer=this.noiseBuf;src.loop=true;fl.type=o.type||'bandpass';fl.frequency.setValueAtTime(o.f||2000,t);
    if(o.f2)fl.frequency.exponentialRampToValueAtTime(o.f2,t+dur);fl.Q.value=o.q||1;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+(o.att||.003));g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    src.connect(fl);fl.connect(g);g.connect(this.out(w));src.start(t,Math.random()*.5);src.stop(t+dur+.02);
  },
  pluck(f,t,vol,w='sfx'){this.osc('triangle',f,t,1.1,vol,w,{f0:f*.97,bend:.06,rev:.5,vib:5.5});this.osc('sine',f*2,t,.35,vol*.35,w,{rev:.3});this.noise(t,.03,vol*.25,w,{f:f*4,q:3});},
  kung(t,vol,w='sfx'){this.osc('sine',58,t,.45,vol,w,{f0:135,bend:.12});this.noise(t,.05,vol*.2,w,{type:'lowpass',f:400});},
  deok(t,vol,w='sfx'){this.noise(t,.07,vol,w,{f:3200,q:1.5});this.osc('triangle',820,t,.05,vol*.4,w);},
  kkwaeng(t,vol,w='sfx'){[587,883,1327,1773,2210].forEach((f,i)=>this.osc('square',f,t,.22,vol*.11/(1+i*.3),w,{filter:'highpass',ff:900}));this.noise(t,.12,vol*.3,w,{f:5000,q:.8});},
  jing(t,vol,w='sfx'){[98,98.7,196.5,295,392.6].forEach((f,i)=>this.osc('sine',f,t,3.2-i*.3,vol/(1+i*.8),w,{att:.03,rev:.6,vib:i===0?3:0}));},
  bell(f,t,vol,w='sfx'){this.osc('sine',f,t,1.6,vol,w,{rev:.6});this.osc('sine',f*2.76,t,.6,vol*.35,w,{rev:.4});this.osc('sine',f*5.4,t,.25,vol*.15,w);},
  wood(f,t,vol,w='sfx'){this.osc('sine',f,t,.07,vol,w);this.noise(t,.03,vol*.5,w,{f:f*2.2,q:4});},
};
const N={D4:293.66,F4:349.23,G4:392,A4:440,C5:523.25,D5:587.33,F5:698.46,G5:783.99,A5:880,D3:146.83,A3:220,C6:1046.5,D6:1174.66};
const SFX={
  ok(){return LP.sfx&&SND.init();},t(){return SND.ctx.currentTime+.01},
  click(){if(this.ok())SND.wood(1400,this.t(),.25);},
  toss(){if(!this.ok())return;const t=this.t();SND.noise(t,.45,.35,'sfx',{f:300,f2:3500,q:1.2,att:.08});
    for(let i=0;i<4;i++){const tt=t+.74+i*.06+Math.random()*.05;SND.wood(900+Math.random()*900,tt,.45);SND.wood(1500+Math.random()*700,tt+.09+Math.random()*.05,.25);}},
  result(n){if(!this.ok())return;const t=this.t();
    if(n===1){SND.deok(t,.5);SND.pluck(N.D4,t,.5);}
    else if(n===2){SND.deok(t,.45);SND.pluck(N.D4,t,.45);SND.pluck(N.F4,t+.12,.45);}
    else if(n===3){[N.D4,N.F4,N.A4].forEach((f,i)=>SND.pluck(f,t+i*.1,.45));SND.kung(t,.5);}
    else if(n===4||n===5){for(let i=0;i<(n===5?12:8);i++)SND.kkwaeng(t+i*.075,.55*(1-i*.04));
      [N.D4,N.F4,N.G4,N.A4,N.C5,N.D5,N.F5,N.A5].forEach((f,i)=>SND.pluck(f,t+.08+i*.07,.4));SND.kung(t,.7);SND.kung(t+.3,.6);SND.kung(t+.6,.7);if(n===5)SND.jing(t+.65,.6);}
    else if(n===-1){SND.osc('sawtooth',140,t,.6,.22,'sfx',{f0:700,bend:.55,filter:'lowpass',ff:1600});SND.wood(500,t,.4);}
    else if(n===0){SND.kung(t,.8);[N.A3,N.A3*.94,N.A3*.89,N.A3*.79].forEach((f,i)=>SND.osc('sawtooth',f,t+.25+i*.28,i===3?.8:.3,.13,'sfx',{filter:'lowpass',ff:900,vib:i===3?6:0}));}},
  step(i,back){if(this.ok())SND.wood(back?700-i*40:620+i*90,this.t(),.5);},
  stack(){if(!this.ok())return;const t=this.t();SND.osc('sine',900,t,.25,.35,'sfx',{f0:300,bend:.2});SND.pluck(N.A4,t+.05,.4);SND.pluck(N.D5,t+.17,.4);},
  capture(){if(!this.ok())return;const t=this.t();SND.noise(t,.35,.6,'sfx',{f:2500,f2:200,q:.7});SND.kung(t,1);SND.kung(t+.13,.8);SND.jing(t+.05,.55);
    for(let i=0;i<5;i++)SND.kkwaeng(t+.12+i*.06,.45);SND.osc('square',160,t,.35,.12,'sfx',{f0:620,bend:.3,filter:'lowpass',ff:2000});},
  finish(){if(!this.ok())return;const t=this.t();[N.D5,N.F5,N.A5,N.D6].forEach((f,i)=>SND.bell(f,t+i*.11,.32));SND.jing(t+.2,.3);},
  turn(){if(!this.ok())return;const t=this.t();SND.kung(t,.45);SND.deok(t+.18,.3);},
  myturn(){if(!this.ok())return;const t=this.t();SND.bell(N.A5,t,.4);SND.bell(N.D6,t+.15,.4);SND.kkwaeng(t+.3,.3);},
  join(){if(!this.ok())return;const t=this.t();SND.pluck(N.D5,t,.35);SND.pluck(N.A5,t+.1,.35);},
  bad(){if(this.ok())SND.osc('square',140,this.t(),.18,.1,'sfx',{filter:'lowpass',ff:600});},
  win(){if(!this.ok())return;const t=this.t();for(let i=0;i<16;i++)SND.kung(t+i*(.12-i*.004),.35+i*.03);
    const s=t+1.5;SND.jing(s,.8);for(let i=0;i<16;i++)SND.kkwaeng(s+i*.1,.45);
    [N.D5,N.F5,N.G5,N.A5,N.G5,N.A5,N.C6,N.D6].forEach((f,i)=>SND.pluck(f,s+.1+i*.16,.5));[N.D5,N.A5,N.D6].forEach((f,i)=>SND.bell(f,s+1.5+i*.1,.3));}
};
const MEL=[[[0,'A4'],[3,'G4'],[6,'A4'],[8,'C5'],[9,'D5']],[[0,'C5'],[3,'A4'],[6,'G4'],[9,'F4']],[[0,'G4'],[2,'A4'],[3,'C5'],[6,'D5'],[8,'F5'],[9,'D5']],
  [[0,'C5'],[3,'A4'],[5,'G4'],[6,'A4']],[[0,'D5'],[3,'F5'],[6,'G5'],[9,'F5']],[[0,'D5'],[2,'C5'],[3,'D5'],[6,'A4'],[9,'C5']],
  [[0,'A4'],[2,'G4'],[3,'F4'],[6,'G4'],[8,'A4'],[9,'C5']],[[0,'C5'],[3,'A4'],[6,'D4']],[[0,'D5']],[[6,'A4']],[[0,'C5'],[6,'G4']],[[0,'A4']]];
const DRUM={0:'덩',3:'덕',5:'쿵',6:'덕',8:'쿵',9:'덕',10:'기',11:'덕'};
const BGM={timer:null,next:0,slot:0,
  start(){if(!bgmOn()||this.timer||!SND.init())return;this.next=SND.ctx.currentTime+.15;this.slot=0;this.timer=setInterval(()=>this.tick(),25);},
  stop(){clearInterval(this.timer);this.timer=null;},
  tense(){const g=MV.shown;return view==='match'&&g&&!g.winner&&g.teams.some(t=>t.pcs.length>1&&t.pcs.filter(v=>v===99).length>=t.pcs.length-1);},
  tick(){const c=SND.ctx,tz=this.tense();while(this.next<c.currentTime+.15){this.play(this.slot,this.next,tz);this.next+=tz?.108:.135;this.slot=(this.slot+1)%(MEL.length*12);}},
  play(s,t,tz){const bar=Math.floor(s/12),k=s%12,d=DRUM[k];
    if(d==='덩'){SND.kung(t,.55,'bgm');SND.deok(t,.35,'bgm');}else if(d==='쿵')SND.kung(t,.4,'bgm');else if(d==='덕')SND.deok(t,.28,'bgm');else if(d==='기')SND.deok(t,.14,'bgm');
    if(tz&&k%3===0)SND.kkwaeng(t,k===0?.3:.16,'bgm');
    MEL[bar].forEach(([sl,nt])=>{if(sl===k)SND.pluck(N[nt],t,.42,'bgm');});
    if(k===0&&bar%2===0)SND.osc('sine',N.D3,t,1.6,.18,'bgm',{att:.08,rev:.3});}
};
// 학생 태블릿은 기본으로 배경음·중계 꺼짐 (교실에 소리가 겹치지 않게)
const bgmOn=()=>LP.bgm===null?ROLE==='host':LP.bgm;
const voiceOn=()=>LP.voice===null?ROLE==='host':LP.voice;
function applySound(){
  if(SND.ctx){SND.bgm.gain.setTargetAtTime(bgmOn()?.2:0,SND.ctx.currentTime,.1);SND.sfx.gain.setTargetAtTime(LP.sfx?1:0,SND.ctx.currentTime,.05);}
  if(bgmOn()&&SND.ctx)BGM.start();else if(!bgmOn())BGM.stop();
  $('#tBgm').classList.toggle('off',!bgmOn());$('#tSfx').classList.toggle('off',!LP.sfx);$('#tVoice').classList.toggle('off',!voiceOn());
}
let koVoice=null;

try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}

/* =================== 파티클 =================== */
const FX={cv:$('#fx'),ps:[],run:false,
  resize(){const d=window.devicePixelRatio||1;this.cv.width=innerWidth*d;this.cv.height=innerHeight*d;this.cv.getContext('2d').setTransform(d,0,0,d,0,0);},
  burst(x,y,cols,n=50,sp=8,o={}){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=sp*(.3+Math.random()*.9);
    this.ps.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(o.up??2),g:o.g??.22,life:1,dec:.008+Math.random()*.014,c:cols[i%cols.length],s:(o.size||7)*(.5+Math.random()),r:Math.random()*6,vr:(Math.random()-.5)*.4,sh:o.shape||(Math.random()<.5?'rect':'star')});}this.go();},
  fireworks(dur=3500){const end=performance.now()+dur,pal=[['#ff5a4a','#ffd54a','#fff'],['#4ab0ff','#fff','#a0e0ff'],['#5ad67a','#ffd54a'],['#ff8ad0','#fff','#ffd54a']];
    const f=()=>{if(performance.now()>end)return;this.burst(innerWidth*(.15+Math.random()*.7),innerHeight*(.15+Math.random()*.4),pal[Math.floor(Math.random()*4)],70,10,{g:.12,shape:'circle',size:4,up:0});
      if(LP.sfx&&SND.ctx){const t=SND.ctx.currentTime;SND.noise(t,.4,.3,'sfx',{type:'lowpass',f:900});}setTimeout(f,280+Math.random()*350);};f();
    for(let i=0;i<120;i++)setTimeout(()=>this.burst(Math.random()*innerWidth,-10,['#d63b2f','#2463b8','#23955a','#e8b33a','#f08cb0'],1,2,{g:.08,up:-2,size:9,shape:'rect'}),i*25);},
  go(){if(this.run)return;this.run=true;const ctx=this.cv.getContext('2d');
    const loop=()=>{ctx.clearRect(0,0,innerWidth,innerHeight);this.ps=this.ps.filter(p=>p.life>0&&p.y<innerHeight+40);
      for(const p of this.ps){p.vy+=p.g;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life-=p.dec;ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,p.life*1.5));ctx.fillStyle=p.c;ctx.translate(p.x,p.y);ctx.rotate(p.r);
        if(p.sh==='circle'){ctx.beginPath();ctx.arc(0,0,p.s/2,0,7);ctx.fill();}
        else if(p.sh==='star'){ctx.beginPath();for(let i=0;i<10;i++){const rr=i%2?p.s*.4:p.s;ctx.lineTo(Math.cos(i*Math.PI/5)*rr,Math.sin(i*Math.PI/5)*rr);}ctx.fill();}
        else ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();}
      if(this.ps.length)requestAnimationFrame(loop);else{this.run=false;ctx.clearRect(0,0,innerWidth,innerHeight);}};requestAnimationFrame(loop);}
};
FX.resize();addEventListener('resize',()=>FX.resize());

/* =================== 윷판 규칙 엔진 =================== */
const P={};
(function(){const L=40,R=560,S=104,C=[300,300];P[0]=[R,R];
  for(let i=1;i<=5;i++)P[i]=[R,R-S*i];for(let i=6;i<=10;i++)P[i]=[R-S*(i-5),L];for(let i=11;i<=15;i++)P[i]=[L,L+S*(i-10)];for(let i=16;i<=19;i++)P[i]=[L+S*(i-15),R];
  const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
  P[20]=lerp(P[5],C,1/3);P[21]=lerp(P[5],C,2/3);P[22]=C;P[23]=lerp(C,P[15],1/3);P[24]=lerp(C,P[15],2/3);P[25]=lerp(P[10],C,1/3);P[26]=lerp(P[10],C,2/3);P[27]=lerp(C,P[0],1/3);P[28]=lerp(C,P[0],2/3);})();
const BIG=new Set([0,5,10,15,22]);
const NAMES={0:['참먹이',0,50],5:['모',0,-46],10:['뒷모',0,-46],15:['찌모',0,52],22:['방',0,54]};
const rng=(a,b)=>{const r=[];for(let i=a;i<=b;i++)r.push(i);return r};
const T15=[15,16,17,18,19,0,'END'];
function route(p){switch(p){case -1:return [...rng(1,19),0,'END'];case 0:return ['END'];case 5:return [20,21,22,23,24,...T15];case 10:return [25,26,22,27,28,0,'END'];
  case 22:return [27,28,0,'END'];case 20:return [21,22,23,24,...T15];case 21:return [22,23,24,...T15];case 23:return [24,...T15];case 24:return [...T15];
  case 25:return [26,22,27,28,0,'END'];case 26:return [22,27,28,0,'END'];case 27:return [28,0,'END'];case 28:return [0,'END'];}return [...rng(p+1,19),0,'END'];}
const PREV={0:19,1:0,20:5,21:20,22:21,23:22,24:23,25:10,26:25,27:22,28:27};
const prevOf=p=>(p in PREV)?PREV[p]:p-1;
function pathFor(p,n){if(n===-1)return [prevOf(p)];const r=route(p),out=[];for(let i=0;i<n;i++){out.push(r[i]);if(r[i]==='END')break;}return out;}
const onBoard=p=>p>=0&&p<=28;
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;const f=v=>Math.max(0,Math.min(255,Math.round(amt>0?v+(255-v)*amt:v*(1+amt))));return `rgb(${f(r)},${f(g)},${f(b)})`;}

const E={ // 게임 한 판에 대한 순수 규칙 함수 (방장만 실행)
  make(comps,rules){return {teams:comps.map((c,i)=>({key:c.key,name:c.name,emoji:c.emoji,color:COLORS[i],members:c.members,mi:0,pcs:Array(rules.pieces).fill(-1)})),
    turn:0,pending:[],throws:1,phase:'throw',sel:0,winner:null,winnerKey:null,sticks:[true,false,true,false],last:null,msg:'윷을 던지세요!',log:[],fx:null,lock:0,rules:{...rules}};},
  cur(g){return g.teams[g.turn]},
  thrower(g,t){t=t||E.cur(g);return t.members.length?t.members[t.mi%t.members.length]:null;},
  valid(g,n){const t=E.cur(g),set=[...new Set(t.pcs.filter(onBoard))];if(n===-1)return set;if(t.pcs.includes(-1))set.push(-1);return set;},
  log(g,s){g.log.unshift(s);if(g.log.length>30)g.log.pop();},
  fixSel(g){if(!g.pending.length)return;if(g.sel>=g.pending.length||!E.valid(g,g.pending[g.sel]).length){const i=g.pending.findIndex(n=>E.valid(g,n).length);g.sel=i<0?0:i;}},
  endTurn(g){const t=E.cur(g);if(t.members.length)t.mi=(t.mi+1)%t.members.length;g.turn=(g.turn+1)%g.teams.length;g.pending=[];g.throws=1;g.phase='throw';g.sel=0;g.msg='윷을 던지세요!';},
  stuck(g){if(g.phase!=='move')return false;if(g.pending.every(n=>!E.valid(g,n).length)){E.log(g,`${esc(E.cur(g).name)}: 빽도 — 움직일 말이 없어 무효`);E.endTurn(g);return true;}E.fixSel(g);return false;},
  roll(r){const faces=[0,1,2,3].map(()=>Math.random()<.6);if(r.nak&&Math.random()<.04)return {n:0,faces};const c=faces.filter(Boolean).length;
    return {n:c===0?5:c===1?((faces[0]&&r.backdo)?-1:1):c,faces};},
  facesFor(n){return ({'-1':[1,0,0,0],'1':[0,0,1,0],'2':[0,1,1,0],'3':[1,1,0,1],'4':[1,1,1,1],'5':[0,0,0,0],'0':[1,0,1,0]})[n].map(Boolean);},
  doThrow(g,forced,fxid){
    const r=forced!==undefined?{n:forced,faces:E.facesFor(forced)}:E.roll(g.rules);const n=r.n,t=E.cur(g),th=E.thrower(g);
    g.sticks=r.faces;g.last=n;E.log(g,`${esc(t.name)}${th&&t.members.length>1?'('+esc(th.name)+')':''}: <b>${RES[n]}</b>`);
    g.throws--;if(n!==0)g.pending.push(n);if(n>=4)g.throws++;
    const fx={id:fxid,kind:'throw',n,faces:r.faces,team:g.turn};
    if(g.throws>0)g.msg=n>=4?`${RES[n]}! 한 번 더 던지세요!`:'한 번 더 던지세요!';
    else if(g.pending.length){g.phase='move';g.sel=g.pending.length-1;g.msg=g.pending.length>1?'어떤 결과부터 쓸지 고르세요':'움직일 말을 고르세요';fx.stuck=E.stuck(g);}
    else{E.endTurn(g);fx.turnEnd=true;}
    g.fx=fx;
  },
  doMove(g,p,fxid){
    const n=g.pending[g.sel],ti=g.turn,t=E.cur(g);
    const idx=p===-1?[t.pcs.indexOf(-1)]:t.pcs.map((v,i)=>v===p?i:-1).filter(i=>i>=0);
    const path=pathFor(p,n),dest=path[path.length-1];
    idx.forEach(i=>t.pcs[i]=dest==='END'?99:dest);
    g.pending.splice(g.sel,1);
    const fx={id:fxid,kind:'move',team:ti,idx,path,n,from:p,captured:[],stacked:false,fin:0};
    if(dest!=='END'){
      fx.stacked=t.pcs.some((v,i)=>v===dest&&!idx.includes(i));
      g.teams.forEach((o,oi)=>{if(oi===ti)return;const c=o.pcs.filter(v=>v===dest).length;if(c){fx.captured.push([oi,c]);o.pcs=o.pcs.map(v=>v===dest?-1:v);}});
    }else fx.fin=idx.length;
    const cap=fx.captured.reduce((a,b)=>a+b[1],0);
    let line=`${esc(t.name)}: ${RES[n]}로 ${idx.length>1?idx.length+'개 업고 ':''}이동`;
    if(dest==='END')line+=` → <b>완주 ${idx.length}개!</b>`;else if(dest===0)line+=' → 참먹이';
    if(fx.stacked)line+=' (<b>업기!</b>)';if(cap)line+=` → <b>${cap}개 잡음!</b>`;E.log(g,line);
    if(t.pcs.every(v=>v===99)){g.winner=t.name;g.winnerKey=t.key;g.phase='over';fx.win=true;E.log(g,`🏆 <b>${esc(t.name)} 승리!</b>`);}
    else if(cap){g.throws=1;g.phase='throw';g.msg='잡았다! 한 번 더 던지세요!';}
    else if(!g.pending.length){if(g.throws>0)g.phase='throw';else{E.endTurn(g);fx.turnEnd=true;}}
    else{g.msg='남은 결과로 말을 움직이세요';E.fixSel(g);fx.stuck=E.stuck(g);}
    g.fx=fx;
  }
};

/* =================== 상태 =================== */
let ROLE=null;          // 'host' | 'client'
let H=null;             // 방 전체 상태 (방장=원본, 학생=복사본)
let view='join';
let conn={ok:false,msg:''};
const U={};             // 방장 되돌리기 기록 {matchKey:[json...]}
const MV={mk:null,shown:null,lastFx:0,q:[],busy:false,hover:null,override:false,touchPick:null,moving:null,winShown:{}};
const autoEntered={};
let lastMyTurnKey='';

/* =================== 통신 =================== */
const NET={
  peer:null,conns:new Map(),bc:null,hostConn:null,retryT:null,
  hostOpen(code){
    if(TEST){this.bc=new BroadcastChannel('yutmp-'+code);this.bc.onmessage=e=>{const d=e.data;if(d.to==='host')hostOnMsg(d.from,d.msg);};conn={ok:true,msg:'테스트 모드'};renderHeader();return;}
    if(typeof Peer==='undefined'){conn={ok:false,msg:'연결 모듈을 불러오지 못했어요 (인터넷 확인)'};renderHeader();return;}
    const p=new Peer(PREFIX+code,{debug:0});this.peer=p;conn={ok:false,msg:'방 여는 중…'};renderHeader();
    p.on('open',()=>{conn={ok:true,msg:'방 열림'};renderHeader();});
    p.on('connection',c=>{c.on('data',d=>{if(d&&d.t==='hello'){this.conns.set(d.uid,c);c._uid=d.uid;}if(c._uid)hostOnMsg(c._uid,d);});
      c.on('close',()=>{if(c._uid&&this.conns.get(c._uid)===c){this.conns.delete(c._uid);hostOnLeave(c._uid);}});});
    p.on('disconnected',()=>{conn={ok:false,msg:'재연결 중…'};renderHeader();setTimeout(()=>{try{p.reconnect();}catch(e){}},1500);});
    p.on('error',e=>{
      if(e.type==='unavailable-id'){conn={ok:false,msg:'이 방 번호가 아직 사용 중이에요. 잠시 후 다시 열어요…'};renderHeader();setTimeout(()=>{try{p.destroy();}catch(_){}NET.hostOpen(code);},4000);}
      else{conn={ok:false,msg:'연결 오류: '+e.type};renderHeader();}});
  },
  hostSend(uid,msg){if(TEST){this.bc&&this.bc.postMessage({to:uid,msg});return;}const c=this.conns.get(uid);if(c&&c.open)try{c.send(msg);}catch(e){}},
  hostBroadcast(msg){if(TEST){this.bc&&this.bc.postMessage({to:'*',msg});return;}this.conns.forEach(c=>{if(c.open)try{c.send(msg);}catch(e){}});},
  clientJoin(code){
    if(TEST){this.bc=new BroadcastChannel('yutmp-'+code);this.bc.onmessage=e=>{const d=e.data;if(d.to===MYID||d.to==='*')clientOnMsg(d.msg);};
      conn={ok:true,msg:'테스트 모드'};this.send(helloMsg());addEventListener('beforeunload',()=>this.send({t:'bye'}));return;}
    if(typeof Peer==='undefined'){conn={ok:false,msg:'연결 모듈을 불러오지 못했어요 (인터넷 확인)'};render();return;}
    const p=new Peer({debug:0});this.peer=p;conn={ok:false,msg:'연결 중…'};renderHeader();
    const connect=()=>{
      clearTimeout(this.retryT);
      const c=p.connect(PREFIX+code,{reliable:true,serialization:'json'});this.hostConn=c;
      const to=setTimeout(()=>{if(!c.open){try{c.close();}catch(e){}retry();}},8000);
      c.on('open',()=>{clearTimeout(to);conn={ok:true,msg:'연결됨'};c.send(helloMsg());renderHeader();});
      c.on('data',d=>clientOnMsg(d));
      c.on('close',()=>{conn={ok:false,msg:'연결이 끊겼어요. 다시 연결 중…'};renderHeader();retry();});
    };
    const retry=()=>{clearTimeout(this.retryT);this.retryT=setTimeout(()=>{if(!(this.hostConn&&this.hostConn.open))connect();},3000);};
    p.on('open',connect);
    p.on('disconnected',()=>{try{p.reconnect();}catch(e){}});
    p.on('error',e=>{if(e.type==='peer-unavailable'){conn={ok:false,msg:'방을 찾을 수 없어요. 방 번호를 확인하세요 (다시 시도 중…)'};renderHeader();if(view==='join')render();retry();}
      else{conn={ok:false,msg:'연결 오류: '+e.type};renderHeader();retry();}});
  },
  send(msg){if(TEST){this.bc&&this.bc.postMessage({to:'host',from:MYID,msg});return;}if(this.hostConn&&this.hostConn.open)try{this.hostConn.send(msg);}catch(e){}}
};
const helloMsg=()=>({t:'hello',uid:MYID,name:LP.name,group:LP.group});

/* =================== 방장 =================== */
function hostCreate(resume){
  ROLE='host';
  if(resume){try{H=JSON.parse(localStorage.getItem('yutmp_host'));}catch(e){H=null;}}
  if(!H){H={code:String(Math.floor(1000+Math.random()*9000)),players:{},mode:'solo',cfg:{pieces:4,backdo:true,nak:false,mode:'screen'},bracket:null,games:{},fxSeq:1,vcount:0};}
  Object.values(H.players).forEach(p=>{if(!p.virtual)p.online=false;});
  NET.hostOpen(H.code);view='lobby';SND.init();applySound();hostChanged();
}
let bcastT=null;
function hostChanged(){
  try{localStorage.setItem('yutmp_host',JSON.stringify(H));}catch(e){}
  clearTimeout(bcastT);bcastT=setTimeout(()=>NET.hostBroadcast({t:'state',H}),20);
  onState();
}
function hostOnMsg(uid,d){
  if(!d||!H)return;
  if(d.t==='hello'){
    const isNew=!H.players[uid];
    H.players[uid]={...(H.players[uid]||{}),id:uid,name:(d.name||'이름없음').slice(0,14),group:H.players[uid]?.groupLocked?H.players[uid].group:(+d.group||0),online:true};
    if(isNew){SFX.join();toast(`${H.players[uid].name} 입장!`);}
    hostChanged();NET.hostSend(uid,{t:'state',H});
  }else if(d.t==='bye'){hostOnLeave(uid);}
  else if(d.t==='act')hostAct(uid,d);
}
function hostOnLeave(uid){if(H.players[uid]){H.players[uid].online=false;hostChanged();}}
const online=id=>id==='host'||(H.players[id]&&H.players[id].online);
function canControl(g,actor){
  if(actor==='host')return true;
  const t=E.cur(g),ms=t.members;if(!ms.some(m=>m.id===actor))return false;
  if(ms.length===1)return true;const th=E.thrower(g,t);
  return th.id===actor||!online(th.id);
}
function hostAct(actor,m){
  const g=H.games[m.match];if(!g||g.winner)return;
  if(Date.now()<g.lock)return;
  if(!canControl(g,actor))return;
  const snap=JSON.stringify(g);
  if(m.a==='throw'){
    if(g.phase!=='throw')return;
    let forced;if(g.rules.mode==='manual'){forced=+m.n;if(!(String(forced) in RES)||(forced===-1&&!g.rules.backdo)||(forced===0&&!g.rules.nak))return;}
    E.doThrow(g,forced,H.fxSeq++);g.lock=Date.now()+1700;
  }else if(m.a==='move'){
    if(g.phase!=='move'||!E.valid(g,g.pending[g.sel]).includes(m.pos))return;
    const steps=pathFor(m.pos,g.pending[g.sel]).length;
    E.doMove(g,m.pos,H.fxSeq++);g.lock=Date.now()+steps*240+700;
    if(g.winner){const [r,i]=m.match.split('-').map(Number);H.bracket.w[r]=H.bracket.w[r]||[];H.bracket.w[r][i]=g.winnerKey;}
  }else if(m.a==='sel'){
    if(g.phase!=='move'||!(m.i>=0&&m.i<g.pending.length))return;g.sel=m.i;
  }else return;
  if(m.a!=='sel'){(U[m.match]=U[m.match]||[]).push(snap);if(U[m.match].length>60)U[m.match].shift();}
  hostChanged();
}
function hostUndo(mk){
  const st=U[mk];if(!st||!st.length)return;
  const g=JSON.parse(st.pop());g.fx=null;g.lock=0;H.games[mk]=g;
  if(!g.winner)clearWin(mk);
  $('#modal').hidden=true;MV.winShown[mk]=false;
  hostChanged();toast('한 단계 되돌렸어요');
}
function clearWin(mk){const [r,i]=mk.split('-').map(Number);const n=H.bracket.slots.length;
  for(let rr=r;(1<<rr)<n;rr++){const ii=Math.floor(i/2**(rr-r));if(H.bracket.w[rr])H.bracket.w[rr][ii]=null;
    if(rr>r){const k=rr+'-'+ii;if(H.games[k]){delete H.games[k];delete U[k];}}}}
function compsFromPlayers(){
  const ps=Object.values(H.players).sort((a,b)=>a.name.localeCompare(b.name,'ko'));
  if(H.mode==='solo')return ps.map(p=>({key:p.id,name:p.name,members:[{id:p.id,name:p.name}]}));
  const groups={},solo=[];
  ps.forEach(p=>{if(p.group>0)(groups[p.group]=groups[p.group]||[]).push(p);else solo.push(p);});
  return Object.keys(groups).sort((a,b)=>a-b).map(g=>({key:'g'+g,name:g+'모둠',members:groups[g].map(p=>({id:p.id,name:p.name}))}))
    .concat(solo.map(p=>({key:p.id,name:p.name,members:[{id:p.id,name:p.name}]})));
}
function makeBracket(){
  let comps=compsFromPlayers();
  if(comps.length<2){toast('2팀(명) 이상 필요해요');SFX.bad();return;}
  for(let i=comps.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[comps[i],comps[j]]=[comps[j],comps[i]];}
  let size=2;while(size<comps.length)size*=2;
  const map={};comps.forEach((c,i)=>{c.emoji=EMOJIS[i%EMOJIS.length];map[c.key]=c;});
  H.bracket={slots:comps.map(c=>c.key).concat(Array(size-comps.length).fill(null)),w:[],comps:map};
  H.games={};for(const k in U)delete U[k];
  SFX.result(3);view='bracket';hostChanged();
}
function derive(B){
  const size=B.slots.length,R=Math.log2(size),rounds=[];
  let pairs=[];for(let i=0;i<size/2;i++)pairs.push([B.slots[i],B.slots[size-1-i]]);
  for(let r=0;r<R;r++){
    const ms=pairs.map(([a,b],i)=>{let w=(B.w[r]&&B.w[r][i])||null;const bye=r===0&&(!a||!b);if(bye)w=a||b;if(w&&w!==a&&w!==b)w=null;return {a,b,w,r,i,bye,k:r+'-'+i};});
    rounds.push(ms);const np=[];for(let i=0;i<ms.length;i+=2)np.push([ms[i].w,ms[i+1]?ms[i+1].w:null]);pairs=np;
  }
  return rounds;
}
function startMatch(mk,pieces){
  const [r,i]=mk.split('-').map(Number);const m=derive(H.bracket)[r][i];if(!m.a||!m.b||m.w)return;
  const B=H.bracket.comps,pc=pieces||H.cfg.pieces;
  H.games[mk]=E.make([B[m.a],B[m.b]],{...H.cfg,pieces:pc});U[mk]=[];
  E.log(H.games[mk],`<b>경기 시작</b>: ${esc(B[m.a].name)} vs ${esc(B[m.b].name)} (말 ${pc}개)`);
  H.games[mk].fx={id:H.fxSeq++,kind:'start'};
  hostChanged();
}
function readyMatches(){const out=[];derive(H.bracket).forEach(ms=>ms.forEach(m=>{if(m.a&&m.b&&!m.w&&!H.games[m.k])out.push(m);}));return out;}
function startAllReady(pieces){
  const list=readyMatches();list.forEach(m=>startMatch(m.k,pieces));
  if(list.length){toast(`${list.length}경기 시작! (말 ${pieces||H.cfg.pieces}개)`);SFX.myturn();say('경기 시작!');}else toast('시작할 경기가 없어요');
}
/* 경기 시작 전 말 개수 고르기 */
function askPieces(title,cb){
  const box=$('#pcsModal');
  $('#pcsTitle').innerHTML=title;
  const opts=[[1,'1개','⚡ 아주 빨리'],[2,'2개','🏃 빨리 (약 10분)'],[3,'3개','🙂 보통'],[4,'4개','🎎 전통 규칙']];
  $('#pcsOpts').innerHTML=opts.map(([n,l,d])=>`<button class="pcsbtn ${n===H.cfg.pieces?'on':''}" data-n="${n}">
    <span class="dots">${'●'.repeat(n)}</span><span class="l">${l}</span><span class="d">${d}</span></button>`).join('');
  box.hidden=false;SFX.click();
  $('#pcsOpts').querySelectorAll('button').forEach(b=>b.onclick=()=>{const n=+b.dataset.n;box.hidden=true;H.cfg.pieces=n;cb(n);});
  $('#pcsCancel').onclick=()=>{box.hidden=true;SFX.click();};
}
function setWinner(mk,key){
  const [r,i]=mk.split('-').map(Number);H.bracket.w[r]=H.bracket.w[r]||[];H.bracket.w[r][i]=key;
  const g=H.games[mk];if(g&&!g.winner){const t=g.teams.find(t=>t.key===key);g.winner=t?t.name:H.bracket.comps[key].name;g.winnerKey=key;g.phase='over';g.fx=null;}
  hostChanged();
}
function resetMatch(mk){delete H.games[mk];delete U[mk];clearWin(mk);hostChanged();}

/* =================== 학생 =================== */
function clientJoin(){
  const code=($('#jCode').value||'').replace(/\D/g,'').slice(0,4),name=($('#jName').value||'').trim();
  if(code.length!==4||!name){toast('방 번호 4자리와 이름을 입력하세요');SFX.bad();return;}
  LP.code=code;LP.name=name.slice(0,14);LP.group=+$('#jGroup').value||0;saveLP();
  ROLE='client';SND.init();applySound();NET.clientJoin(code);view='lobby';render();
}
function clientOnMsg(d){
  if(!d)return;
  if(d.t==='state'){H=d.H;onState();}
}

/* =================== 공통: 상태 반영 =================== */
function myGames(){if(!H||!H.games)return [];return Object.entries(H.games).filter(([k,g])=>g.teams.some(t=>t.members.some(m=>m.id===MYID)));}
function myControl(g){if(!g||g.winner)return false;if(ROLE==='host')return MV.override;return canControlClient(g);}
function canControlClient(g){const t=E.cur(g),ms=t.members;if(!ms.some(m=>m.id===MYID))return false;if(ms.length===1)return true;const th=E.thrower(g,t);return th.id===MYID||!(H.players[th.id]&&H.players[th.id].online);}
function onState(){
  if(!H)return;
  if(ROLE==='client'){
    const me=H.players[MYID];
    if(me&&me.group!==LP.group){LP.group=me.group;saveLP();}
    // 내 경기 자동 입장 + 내 차례 알림
    const active=myGames().find(([k,g])=>!g.winner);
    if(active){
      const [k,g]=active;
      if(!autoEntered[k]){autoEntered[k]=true;openMatch(k);toast('내 경기가 시작됐어요!');SFX.myturn();return;}
      const turnKey=k+':'+g.turn+':'+(g.teams[g.turn].mi)+':'+g.phase;
      if(canControlClient(g)&&g.phase==='throw'&&turnKey!==lastMyTurnKey){lastMyTurnKey=turnKey;

function openMatch(mk){$('#modal').hidden=true;MV.gen=(MV.gen||0)+1;MV.mk=mk;MV.shown=null;MV.q=[];MV.busy=false;MV.hover=null;MV.touchPick=null;view='match';render();}
function matchSync(){
  const g=H.games[MV.mk];

  if(!g.winner&&MV.winShown[MV.mk]){MV.winShown[MV.mk]=false;$('#modal').hidden=true;}
  if(!MV.shown){MV.shown=clone(g);MV.lastFx=g.fx?g.fx.id:0;renderMatch(true);if(g.winner)maybeWin(g,true);return;}
  if(g.fx&&g.fx.id>MV.lastFx){MV.lastFx=g.fx.id;MV.q.push(clone(g));pump();}
  else if(!MV.busy){MV.shown=clone(g);renderMatch();}
}
async function pump(){
  if(MV.busy)return;MV.busy=true;const gen=MV.gen;
  while(MV.q.length){const next=MV.q.shift();const fast=MV.q.length>0;try{await playFx(MV.shown,next,fast);}catch(e){console.error(e);}
    if(gen!==MV.gen)return;MV.shown=next;renderMatch();if(next.winner)maybeWin(next);}
  MV.busy=false;
  const g=H.games[MV.mk];if(g&&view==='match'&&(!g.fx||g.fx.id<=MV.lastFx)){MV.shown=clone(g);renderMatch();}
}
async function playFx(prev,next,fast){
  const gen=MV.gen,alive=()=>gen===MV.gen&&view==='match';
  const fx=next.fx;if(!fx||view!=='match')return;
  if(fx.kind==='start'){SFX.turn();return;}
  if(fx.kind==='throw'){
    MV.shown=prev;renderMatch();
    if(!fast){layoutSticks(fx.faces,true,fx.n===0);SFX.toss();await sleep(1000);if(!alive())return;}
    else layoutSticks(fx.faces,false);
    const n=fx.n,big=n===4||n===5;
    SFX.result(n);splash({emo:RINFO[n][0],word:RES[n],sub:RINFO[n][1],cls:big?'gold':n<=0?'red':''});
    if(big){shake();const b=$('#boardwrap').getBoundingClientRect();FX.burst(b.left+b.width/2,b.top+b.height/2,['#ffd54a','#ff5a4a','#fff','#4ab0ff'],120,14,{g:.18});}
    say(n===4?'윷이야! 한 번 더!':n===5?'모다! 한 번 더!':n===0?'낙! 무효!':RES[n]+'!');
    MV.shown=next;renderMatch();
    if(!fast)await sleep(650);if(!alive())return;
    if(fx.stuck){splash({emo:'🤷',word:'무효',sub:'움직일 말이 없어요',cls:'small'});await sleep(fast?0:900);if(!alive())return;}
    if(fx.turnEnd||fx.stuck)SFX.turn();
    return;
  }
  if(fx.kind==='move'){
    const work=clone(prev);const t=work.teams[fx.team];
    work.phase='anim';MV.shown=work;renderMatch();
    for(let k=0;k<fx.path.length;k++){const node=fx.path[k];fx.idx.forEach(i=>t.pcs[i]=node==='END'?99:node);MV.moving={ti:fx.team,pos:node==='END'?null:node};
      renderBoard(work);SFX.step(k,fx.n===-1);await sleep(fast?60:(fx.n===-1?300:240));if(!alive())return;}
    MV.moving=null;
    const dest=fx.path[fx.path.length-1];
    if(fx.captured.length){const from=nodeScreen(dest);fx.captured.forEach(([oi,c])=>flyHome(work,oi,c,from));
      FX.burst(from[0],from[1],['#ff3b2f','#ffd54a','#fff','#333'],110,13);shake();SFX.capture();splash({emo:'💥',word:'잡았다!',sub:'한 번 더 던져요!',cls:'red'});say('잡았다! 한 번 더!');}
    else if(fx.stacked){SFX.stack();splash({emo:'🤝',word:'업었다!',sub:'함께 움직여요',cls:'small'});say('업었다!');const [x,y]=nodeScreen(dest);FX.burst(x,y,[t.color,'#fff','#ffd54a'],40,6,{shape:'circle',size:6});}
    if(fx.fin){const [x,y]=nodeScreen(0);FX.burst(x,y,['#ffd54a','#fff','#ffb300',t.color],90,11,{shape:'star'});SFX.finish();if(!fx.captured.length)splash({emo:'🏁',word:'완주!',sub:`${fx.fin}개 들어왔어요`,cls:'small'});say('완주!');}
    if(!fast)await sleep(fx.captured.length?700:300);if(!alive())return;
    if(fx.stuck){MV.shown=next;renderMatch();splash({emo:'🤷',word:'무효',sub:'움직일 말이 없어요',cls:'small'});await sleep(fast?0:900);if(!alive())return;}
    if(fx.turnEnd||fx.stuck)SFX.turn();
  }
}

    <button class="btn light" id="cancelJoin">처음으로</button></div>`;$('#cancelJoin').onclick=()=>location.reload();return;}
  if(view==='lobby')return ROLE==='host'?renderHostLobby(app):renderClientLobby(app);
  if(view==='bracket')return renderBracket(app);
}
function renderJoin(app){
  let saved=null;try{saved=JSON.parse(localStorage.getItem('yutmp_host')||'null');}catch(e){}
  const gopts=['없음',1,2,3,4,5,6,7,8].map((g,i)=>`<option value="${i}" ${LP.group===i?'selected':''}>${i?g+'모둠':'모둠 없음 (개인)'}</option>`).join('');
  app.innerHTML=`<div class="join">
    <div class="card"><h2>🙋 학생 입장</h2>
      ${conn.msg&&!conn.ok?`<div class="err">${esc(conn.msg)}</div>`:''}
      <div class="f"><label class="dh" style="font-size:20px">방 번호 (칠판의 4자리)</label><input id="jCode" type="text" inputmode="numeric" maxlength="4" placeholder="0000" value="${esc(LP.code)}"></div>
      <div class="f"><label class="dh" style="font-size:20px">내 이름</label><input id="jName" type="text" maxlength="14" placeholder="예: 김민준" value="${esc(LP.name)}"></div>
      <div class="f"><label class="dh" style="font-size:20px">우리 모둠</label><select id="jGroup">${gopts}</select>
        <span class="muted">태블릿 1대로 모둠이 함께 할 때는 이름에 모둠 이름(예: 1모둠)을 쓰고 '모둠 없음'을 고르세요.</span></div>
      <button class="btn red big" id="jGo">입장하기</button>
    </div>
    <div class="card"><h2>🧑‍🏫 선생님</h2>
      <p class="muted">이 기기(교실 TV)가 방장이 되어 대진표와 모든 판정을 맡아요. 경기 중에는 이 화면을 닫지 마세요.</p>
      <button class="btn gold big" id="hNew">새 방 만들기</button>
      ${saved&&saved.code?`<button class="btn light big" id="hResume" style="margin-top:10px">이전 방(${esc(saved.code)}) 이어서 열기</button>`:''}
      ${TEST?'<p class="err">테스트 모드 — 같은 브라우저 탭끼리만 연결돼요</p>':''}
    </div></div>`;
  $('#jGo').onclick=clientJoin;
  $('#jCode').onkeydown=$('#jName').onkeydown=e=>{if(e.key==='Enter')clientJoin();};
  $('#hNew').onclick=()=>{try{localStorage.removeItem('yutmp_host');}catch(e){}hostCreate(false);};
  if($('#hResume'))$('#hResume').onclick=()=>hostCreate(true);
}
function joinURL(){return location.href.split('#')[0]+(TEST?'#test':'');}
function seg(opts,val,id){return `<span class="seg" id="${id}">${opts.map(([v,l])=>`<button class="${v===val?'on':''}" data-v="${v}">${l}</button>`).join('')}</span>`;}
function bindSeg(id,opts,set){document.querySelectorAll('#'+id+' button').forEach(b=>b.onclick=()=>{const o=opts.find(x=>String(x[0])===b.dataset.v);set(o[0]);SFX.click();hostChanged();});}
function renderHostLobby(app){
  const ps=Object.values(H.players).sort((a,b)=>(a.group-b.group)||a.name.localeCompare(b.name,'ko'));
  const comps=compsFromPlayers();
  const O={mode:[['solo','🧍 개인전'],['team','👥 모둠전']],pieces:[[1,'1개'],[2,'2개'],[3,'3개'],[4,'4개(전통)']],yn:[[true,'사용'],[false,'안 씀']],thr:[['screen','화면 던지기'],['manual','직접 입력']]};
  app.innerHTML=`<div class="lobby">
    <div class="card">
      <div class="bigcode"><div class="dh" style="font-size:24px">방 번호</div><div class="n">${esc(H.code)}</div><div class="u">태블릿에서 이 주소로 접속: <b>${esc(joinURL())}</b></div></div>
      <h2 style="margin:16px 0 4px">👥 입장한 친구들 (${ps.length}명 · 접속 ${ps.filter(p=>p.online||p.virtual).length})</h2>
      <p class="muted" style="margin:0">모둠 표시를 누르면 모둠을 바꿀 수 있어요. ×는 명단에서 빼기.</p>
      <div class="plist">${ps.map(p=>`<span class="pchip"><i class="${p.online||p.virtual?'on':''}"></i>${esc(p.name)}${p.virtual?' <small>(가상)</small>':''}
        <button class="g" data-g="${esc(p.id)}" style="background:${GCOL[p.group]}">${p.group?p.group+'모둠':'개인'}</button><button class="x" data-x="${esc(p.id)}">×</button></span>`).join('')||'<span class="muted">아직 아무도 없어요. 학생들에게 방 번호를 알려 주세요!</span>'}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
        <button class="btn light sm" id="addV">🧪 가상 참가자 추가</button>
        <span style="display:flex;gap:6px;align-items:center">모둠 무작위 배정 <select id="ngrp">${[2,3,4,5,6,7,8].map(n=>`<option ${n===4?'selected':''}>${n}</option>`).join('')}</select>개 <button class="btn light sm" id="rndG">🎲 배정</button></span>
      </div>
    </div>
    <div class="card">
      <h2 style="margin-top:0">⚙️ 경기 방식</h2>
      <label class="row">대회 방식 ${seg(O.mode,H.mode,'sMode')}</label>
      <label class="row">기본 말 개수 ${seg(O.pieces,H.cfg.pieces,'sPcs')}</label><div class="muted" style="margin-top:-6px">경기마다 시작할 때 다시 고를 수 있어요.</div>
      <label class="row">빽도 ${seg(O.yn,H.cfg.backdo,'sBd')}</label>
      <label class="row">낙 ${seg(O.yn,H.cfg.nak,'sNak')}</label>
      <label class="row">윷 던지기 ${seg(O.thr,H.cfg.mode,'sThr')}</label>
      <div class="muted">${H.mode==='team'?'모둠원이 차례마다 돌아가며 자기 태블릿으로 던져요. 모둠이 없는 사람은 혼자 한 팀이 돼요.':'한 사람(한 기기)이 한 선수예요. 태블릿을 모둠마다 1대씩 쓸 때도 개인전을 고르고 이름을 모둠 이름으로 입장하면 돼요.'}</div>
      <h3 style="margin:14px 0 4px">참가 ${H.mode==='team'?'팀':'선수'} ${comps.length}</h3>
      <div class="teamsprev">${comps.map(c=>`<div><b>${esc(c.name)}</b>${c.members.length>1?' — '+c.members.map(m=>esc(m.name)).join(', '):''}</div>`).join('')}</div>
      <button class="btn red big" id="mkB" style="margin-top:14px">🏆 대진표 만들기</button>
      ${H.bracket?'<p class="muted">※ 다시 만들면 진행 중인 대진표와 경기가 지워져요.</p>':''}
    </div></div>`;
  app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{const p=H.players[b.dataset.g];p.group=(p.group+1)%9;p.groupLocked=true;SFX.click();hostChanged();});
  app.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{delete H.players[b.dataset.x];SFX.click();hostChanged();});
  $('#addV').onclick=()=>{const names=['가상 민준','가상 서연','가상 지호','가상 수아','가상 도윤','가상 하은','가상 시우','가상 지유'];
    for(let i=0;i<4;i++){const n=H.vcount++;const id='v'+n;H.players[id]={id,name:names[n%8]+(n>=8?n:''),group:0,online:false,virtual:true};}SFX.join();hostChanged();};
  $('#rndG').onclick=()=>{const n=+$('#ngrp').value;const ids=Object.keys(H.players);for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]];}
    ids.forEach((id,i)=>{H.players[id].group=i%n+1;H.players[id].groupLocked=true;});H.mode='team';SFX.result(3);hostChanged();};
  bindSeg('sMode',O.mode,v=>H.mode=v);bindSeg('sPcs',O.pieces,v=>H.cfg.pieces=v);bindSeg('sBd',O.yn,v=>H.cfg.backdo=v);bindSeg('sNak',O.yn,v=>H.cfg.nak=v);bindSeg('sThr',O.thr,v=>H.cfg.mode=v);
  $('#mkB').onclick=makeBracket;
}
function renderClientLobby(app){
  const ps=Object.values(H.players);const me=H.players[MYID];
  app.innerHTML=`<div class="card" style="max-width:800px;margin:10px auto;text-align:center">
    <div style="font-size:70px">${me?'✅':'⏳'}</div>
    <h2 style="font-size:32px;margin:6px 0">${me?`${esc(me.name)}, 입장 완료!`:'입장하는 중…'}</h2>
    ${me?`<p class="dh" style="font-size:22px">${me.group?`<span style="color:${GCOL[me.group]}">${me.group}모둠</span>`:'개인'} · ${H.mode==='team'?'모둠전':'개인전'}</p>`:''}
    <p class="muted">${H.bracket?'대진표가 나왔어요! 위의 🏆 대진표를 눌러 보세요.':'선생님이 대진표를 만들 때까지 기다려요. 내 경기가 시작되면 자동으로 경기 화면이 열려요.'}</p>
    <div class="plist" style="justify-content:center">${ps.map(p=>`<span class="pchip" style="padding-right:12px"><i class="${p.online||p.virtual?'on':''}"></i>${esc(p.name)}${p.group?` <span class="g" style="background:${GCOL[p.group]}">${p.group}</span>`:''}</span>`).join('')}</div>
  </div>`;
}
function renderBracket(app){
  if(!H.bracket){app.innerHTML=`<div class="card" style="text-align:center"><h2>아직 대진표가 없어요</h2>${ROLE==='host'?'<p class="muted">👥 참가자 화면에서 대진표를 만들어 주세요.</p>':''}</div>`;return;}
  const B=H.bracket,rounds=derive(B),R=rounds.length,champ=rounds[R-1][0].w;
  const nm=k=>B.comps[k]?`${B.comps[k].emoji} ${esc(B.comps[k].name)}`:'';
  const isMine=k=>k&&B.comps[k]&&B.comps[k].members.some(m=>m.id===MYID);
  let h='';
  if(ROLE==='host')h+=`<div class="bk-head"><button class="btn red" id="allGo">▶ 준비된 경기 모두 시작</button><span class="muted">경기는 동시에 여러 개 진행할 수 있어요. 관전을 누르면 TV로 크게 볼 수 있어요.</span></div>`;
  if(champ)h+=`<div class="champ">🏆 우승 🏆<div class="name">${nm(champ)}</div></div>`;
  h+='<div class="bracket">';
  rounds.forEach((ms,r)=>{
    const left=R-r;h+=`<div class="round"><h3>${left===1?'🏆 결승':left===2?'🔥 준결승':2**left+'강'}</h3>`;
    ms.forEach(m=>{
      const g=H.games[m.k],live=g&&!g.winner;
      const row=x=>{if(!x)return `<div class="t empty">${m.bye?'부전승':'대기 중'}</div>`;
        const cls=m.w?(m.w===x?'win':'lose'):'';let sc='';
        if(g){const t=g.teams.find(t=>t.key===x);if(t)sc=`<span class="sc">🏁 ${t.pcs.filter(v=>v===99).length}/${t.pcs.length}</span>`;}
        const wb=ROLE==='host'&&m.a&&m.b&&!m.w?`<button class="wbtn" data-win="${m.k}|${esc(x)}">승</button>`:'';
        return `<div class="t ${cls}">${nm(x)}${m.w===x?' 🏅':''}${sc}${wb}</div>`;};
      h+=`<div class="match ${isMine(m.a)||isMine(m.b)?'mine':''} ${live?'live':''}">${row(m.a)}${row(m.b)}`;
      const foot=[];
      if(live){foot.push(`<button class="watch" data-watch="${m.k}">${isMine(m.a)||isMine(m.b)?'🎮 내 경기로':'👀 관전'}</button>`);}
      else if(g&&g.winner)foot.push(`<button class="watch" data-watch="${m.k}">📜 기록</button>`);
      if(ROLE==='host'){
        if(m.a&&m.b&&!m.w&&!g)foot.push(`<button data-start="${m.k}">▶ 시작</button>`);
        if((g||m.w)&&!m.bye)foot.push(`<button class="ghost" data-reset="${m.k}">↺ 다시</button>`);
      }
      if(foot.length)h+=`<div class="foot">${foot.join('')}</div>`;
      h+='</div>';
    });
    h+='</div>';
  });
  app.innerHTML=h+'</div>';
  app.querySelectorAll('[data-watch]').forEach(b=>b.onclick=()=>{SFX.click();openMatch(b.dataset.watch);});
  app.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.start,[r,i]=k.split('-').map(Number),m=derive(H.bracket)[r][i],C=H.bracket.comps;
    askPieces(`<b>${esc(C[m.a].emoji)} ${esc(C[m.a].name)}</b> 對 <b>${esc(C[m.b].emoji)} ${esc(C[m.b].name)}</b><br>말 몇 개로 할까요?`,n=>{startMatch(k,n);SFX.myturn();say(`말 ${n}개로 경기 시작!`);});});
  app.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>{
    if(!b.dataset.sure){b.dataset.sure=1;b.textContent='정말?';setTimeout(()=>{if(b.isConnected){delete b.dataset.sure;b.textContent='↺ 다시';}},2500);return;}
    resetMatch(b.dataset.reset);});
  app.querySelectorAll('[data-win]').forEach(b=>b.onclick=()=>{
    if(!b.dataset.sure){b.dataset.sure=1;b.textContent='확정?';setTimeout(()=>{if(b.isConnected){delete b.dataset.sure;b.textContent='승';}},2500);return;}
    const [k,key]=b.dataset.win.split('|');setWinner(k,key);});
  const ag=$('#allGo');if(ag)ag.onclick=()=>{const n=readyMatches().length;if(!n){toast('시작할 경기가 없어요');return;}
    askPieces(`준비된 <b>${n}경기</b>를 한꺼번에 시작해요<br>말 몇 개로 할까요?`,p=>startAllReady(p));};
}

/* =================== 기타 =================== */
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800);}
document.addEventListener('keydown',e=>{if(e.code==='Space'&&view==='match'&&!/INPUT|TEXTAREA|BUTTON|SELECT/.test(document.activeElement.tagName)){const g=MV.shown;
  if(g&&g.rules.mode==='screen'&&myControl(g)&&g.phase==='throw'&&!MV.busy){e.preventDefault();act({a:'throw'});}}});
document.addEventListener('pointerdown',()=>{if(ROLE){SND.init();if(bgmOn())BGM.start();}},true);
$('#tBgm').onclick=()=>{LP.bgm=!bgmOn();saveLP();SND.init();applySound();};
$('#tSfx').onclick=()=>{LP.sfx=!LP.sfx;saveLP();SND.init();applySound();SFX.click();};
$('#tVoice').onclick=()=>{LP.voice=!voiceOn();saveLP();applySound();if(voiceOn()){pickVoice();if(koVoice)say('중계를 시작합니다!');else toast('이 기기에는 한국어 음성이 없어요');}};
$('#fsBtn').onclick=()=>{try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>toast('전체화면을 쓸 수 없어요'));}catch(e){}};
addEventListener('beforeunload',e=>{if(ROLE==='host'&&H&&Object.keys(H.games).length){e.preventDefault();e.returnValue='';}});
applySound();render();
</script>
</body>
</html>
